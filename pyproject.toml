[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mainsequence"
version = "6.0.38"
description = "Main Sequence SDK "
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Main Sequence GmbH", email = "dev@main-sequence.io" }]
license = "LicenseRef-MainSequence-Proprietary"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]


# PEP 621 dependencies (published requirements)

dependencies = [
  "alembic>=1.18.4",
  "cachetools",
  "click>=8.3.3",
  "concurrent-log-handler",
  "numpy",
  "opentelemetry-api",
  "opentelemetry-exporter-otlp",
  "opentelemetry-sdk",
  "packaging>=24.2",
  "pandas",
  "protobuf>=6.33.5",
  "psutil",
  "psycopg2>=2.9.12",
  "pydantic>=2.11,<3",
  "pygments>=2.20.0",
  "pyyaml",
  "requests>=2.33.0",
  "sqlalchemy>=2,<3",
  "structlog",
  "tqdm",
  "typer",
  "urllib3>=2.7.0",
]

[project.optional-dependencies]
"local-data" = [
  "duckdb>=1.4.2",
  "pyarrow>=23.0.1",
]
[project.urls]
Homepage = "https://github.com/mainsequence-sdk/mainsequence-sdk"
Issues = "https://github.com/mainsequence-sdk/mainsequence-sdk/issues"
[project.scripts]
mainsequence = "mainsequence.cli.cli:app"
ms = "mainsequence.cli.cli:app"

# PEP 621 dependencies (published requirements)
[dependency-groups]
dev = [
  "black>=26.3.1",
  "IPython",
  "mkdocs",
  "mkdocs-autorefs",
  "mkdocs-gen-files",
  "mkdocs-literate-nav",
  "mkdocs-material",
  "mkdocs-mermaid2-plugin",
  "mkdocstrings[python]",
  "pipdeptree",
  "pre-commit",
  "pymdown-extensions>=11.0.1",
  "pytest>=9.0.3",
  "ruff>=0.14.0",
  "streamlit>=1.54.0",
  "twine",
]

# Package discovery equivalent to find_packages(include=['mainsequence','mainsequence.*'])
[tool.setuptools.packages.find]
namespaces = true
include = ["mainsequence", "mainsequence.*", "agent_scaffold", "agent_scaffold.*"]

# Include your non-.py assets in wheels/sdists
[tool.setuptools.package-data]
"mainsequence" = ["**/*.html", "**/*.css", "**/*.png", "**/*.toml", "**/*.json", "**/*.mako"]
"agent_scaffold" = ["*.md", "**/*.md"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true


# --------------------
# Formatting (Black)
# --------------------
[tool.black]
line-length = 100
target-version = ["py313"]

# --------------------
# Linting & import sort (Ruff)
# --------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["build", "dist", ".venv", ".tox", ".mypy_cache", ".ruff_cache"]
fix = true                    # <-- move fix here

[tool.ruff.lint]
# E/F: pycodestyle/pyflakes, I: import order, B: bugbear, UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = ["E203", "E501"]     # let Black handle these

[tool.ruff.lint.per-file-ignores]
"mainsequence/cli/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["mainsequence", "agent_scaffold"]
