[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mainsequence"
version = "9.0.9"
description = "Main Sequence SDK"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Main Sequence GmbH", email = "dev@main-sequence.io" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]


# PEP 621 dependencies (published requirements)

dependencies = [
  "cachetools",
  "click>=8.3.3",
  "concurrent-log-handler",
  "keyring>=25.7.0,<26",
  "opentelemetry-api",
  "opentelemetry-exporter-otlp",
  "opentelemetry-sdk",
  "packaging>=24.2",
  "protobuf>=6.33.5",
  "psutil",
  "pydantic>=2.11,<3",
  "pygments>=2.20.0",
  "PyJWT[crypto]>=2.10,<3",
  "pyyaml",
  "requests>=2.33.0",
  "structlog",
  "typer",
  "urllib3>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/mainsequence-sdk/mainsequence-sdk"
Issues = "https://github.com/mainsequence-sdk/mainsequence-sdk/issues"
[project.scripts]
mainsequence = "mainsequence.cli.cli:app"
ms = "mainsequence.cli.cli:app"

# PEP 621 dependencies (published requirements)
[dependency-groups]
dev = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "black>=26.3.1",
  "IPython",
  "mkdocs",
  "mkdocs-autorefs",
  "mkdocs-gen-files",
  "mkdocs-literate-nav",
  "mkdocs-material",
  "mkdocs-mermaid2-plugin",
  "mkdocstrings[python]",
  "opentelemetry-sdk",
  "packaging>=24.2",
  "pipdeptree",
  "pre-commit",
  "pymdown-extensions>=11.0.1",
  "pytest>=9.0.3",
  "ruff>=0.14.0",
  "twine",
]

# Package discovery for SDK code and the Markdown-only scaffold namespace.
[tool.setuptools.packages.find]
namespaces = true
include = ["mainsequence", "mainsequence.*", "agent_scaffold", "agent_scaffold.*"]

[tool.setuptools.package-data]
"mainsequence" = ["**/*.html", "**/*.css", "**/*.png", "**/*.toml", "**/*.json", "**/*.mako"]
"agent_scaffold" = ["*.md", "**/*.md"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true


# --------------------
# Testing (pytest)
# --------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repository root on sys.path so tests can import `scripts`. `pytest`
# invoked as `python -m pytest` gets this from the CWD, but the `pytest`
# entrypoint (what `uv run pytest` and CI use) does not.
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
  "live: talks to a live Main Sequence backend and needs credentials; deselected unless `-m live` is passed",
]

# --------------------
# Formatting (Black)
# --------------------
[tool.black]
line-length = 100
target-version = ["py313"]

# --------------------
# Linting & import sort (Ruff)
# --------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["build", "dist", ".venv", ".tox", ".mypy_cache", ".ruff_cache"]
fix = true

[tool.ruff.lint]
# E/F: pycodestyle/pyflakes, I: import order, B: bugbear, UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = ["E203", "E501"]     # let Black handle these

[tool.ruff.lint.per-file-ignores]
"mainsequence/cli/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["mainsequence", "agent_scaffold"]
