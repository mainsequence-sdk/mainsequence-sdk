version: 2

# Dependabot reads this file from the default branch (`main`) only, which is why
# it lives here rather than on `development`. The PRs it opens, however, target
# `development`: that is the integration branch (pushes to it publish a dev
# release), while `main` only moves through tagged releases.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    # One version-update PR per scope, majors included. Splitting majors out
    # produced a PR per package per week, and most of them were dev tooling a
    # consumer of this library never resolves: what they install is decided by
    # the ranges in `pyproject.toml`, not by this lock file. Vulnerabilities do
    # not wait for the monthly run -- security updates ignore `interval`, and
    # `dependency-audit.yml` audits both scopes on every dependency-touching PR
    # and on its own weekly cron.
    groups:
      production:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "major"
          - "minor"
          - "patch"
      development:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "major"
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
