#publish-to-pypi.yml
# This is a GitHub Actions workflow file that automates the process of
# building and publishing your Python package to PyPI.
# It is triggered automatically whenever you push a new git tag to your repository.

name: Publish Python Package to PyPI

# This section defines the trigger for the workflow.
# It runs on any push event that includes a new tag.
#
# A release is a plain tag vX.Y.Z on `main`. The job below refuses a tag whose
# commit is not contained in `main`, so a tag made on any other branch publishes
# nothing. Development releases come from `publish-dev-to-pypi.yml` instead.
# See docs/knowledge/release_process.md.
on:
  push:
    tags:
      - 'v*' # Trigger on tags that start with 'v', e.g., v2.0.1

jobs:
  # The 'deploy' job contains all the steps for building and publishing.
  deploy:
    # This job runs on the latest version of Ubuntu provided by GitHub.
    runs-on: ubuntu-latest
    environment: pypi
    # This section is CRITICAL for trusted publishing.
    # It grants the necessary permission for the workflow to request an
    # OIDC token from GitHub, which PyPI will then verify.
    permissions:
      id-token: write # This is required for trusted publishing
      contents: read           # recommended
    # These are the individual steps the workflow will execute in order.
    steps:
      # Step 1: Check out the repository's code
      # This downloads your source code into the runner environment.
      # The full history is fetched so the next step can ask whether the tagged
      # commit is contained in `main`.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Refuse a tag that was not made on `main`
      # A release tag on any other branch would otherwise publish a final
      # version built from code that `main` never received.
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not contained in main. A release tag must be made on main; see docs/knowledge/release_process.md."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is contained in main."

      # Step 3: Set up a specific version of Python
      # This ensures a consistent environment for building your package.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The tag and pyproject.toml must name the same release. pyproject.toml is
      # the only source of the version, so a tag that disagrees would publish
      # a number nobody asked for, or fail at upload as a duplicate.
      - name: Verify the tag matches the declared version
        run: |
          declared="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "v${declared}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the version pyproject.toml declares (${declared})."
            exit 1
          fi

      # Step 4: Install build dependencies
      # This step installs the 'build' package, which is the modern
      # standard for building Python packages.
      - name: Install dependencies
        run: python -m pip install --upgrade build

      # Step 5: Build the package
      # This command creates the sdist (source distribution) and wheel
      # files in a 'dist/' directory.
      - name: Build package
        run: python -m build

      # Step 6: Publish the package to PyPI
      # This is the final step. It uses an official action from the Python
      # Packaging Authority (PyPA) to handle the upload. Because of the
      # 'permissions' key above, it will automatically handle the trusted
      # publishing authentication with PyPI.
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # pyproject.toml is the only source of the version. Once X.Y.Z is released,
  # `development` has to declare the next release, or its development builds
  # would be refused as already released.
  open-next-version:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the version tooling
        run: python -m pip install --upgrade packaging uv

      - name: Raise the patch number when development still declares the released version
        run: |
          declared="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "v${declared}" != "${GITHUB_REF_NAME}" ]; then
            echo "development declares ${declared}, not the released ${GITHUB_REF_NAME#v}; nothing to raise."
            exit 0
          fi
          next="$(python scripts/dev_release_version.py --bump-patch)"
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pyproject.toml uv.lock
          git commit -m "Declare ${next} as the next release after ${GITHUB_REF_NAME#v}"
          git push origin HEAD:development
