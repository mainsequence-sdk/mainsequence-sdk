name: Publish development release to PyPI

# Every push to `development` publishes one PEP 440 development release,
# `X.Y.Z.devN`. Nothing is edited or tagged by hand, and nothing is published
# unless the test suite passes first.
#
# `pip install mainsequence` never resolves to one of these: pip and uv ignore
# development releases unless one is pinned exactly or `--pre` is passed.
#
# Final releases are a `vX.Y.Z` tag on `main` and go through
# `publish-to-pypi.yml`. See docs/knowledge/release_process.md.

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One push is one development release. A newer push cancels a build that is
  # still running, so the newest commit is the one that reaches PyPI.
  group: publish-dev-to-pypi
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    # The guard: the same suite that gates pull requests, not a second copy of
    # it. `publish` does not start unless this succeeds.
    uses: ./.github/workflows/tests.yml

  publish:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: python -m pip install --upgrade build packaging

      - name: Compute the development version and write it to pyproject.toml
        id: version
        # The base is the newest final release on PyPI with its patch number
        # raised by one; the serial is this run's number. The working tree is
        # only edited for this build — nothing is committed or tagged.
        run: |
          version="$(python scripts/dev_release_version.py --run-number "${GITHUB_RUN_NUMBER}" --write)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing development release ${version} from ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"

      - name: Build package
        run: python -m build

      - name: Check the built distributions carry the computed version
        run: |
          shopt -s nullglob
          expected='${{ steps.version.outputs.version }}'
          found=(dist/mainsequence-"${expected}"*)
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::No distribution in dist/ carries version ${expected}."
            ls -la dist/
            exit 1
          fi
          printf 'Built %s\n' "${found[@]}"

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
