name: Python compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"
    env:
      TDAG_ROOT_PATH: ${{ runner.temp }}/mainsequence-logs

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PostgreSQL build requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpq-dev

      - name: Install uv
        run: python -m pip install uv

      - name: Sync locked development environment
        run: uv sync --frozen --all-extras --python ${{ matrix.python-version }}

      - name: Test dependency boundaries
        run: uv run --frozen pytest -q tests/test_dependency_extras.py

      - name: Test interpreter and virtual-environment handling
        run: >-
          uv run --frozen pytest -q tests/test_cli.py
          -k "normalize_python_version_request or project_build_local_venv"

      - name: Build distributions
        run: uv build

      - name: Install and smoke-test the wheel
        run: |
          wheel_env="${RUNNER_TEMP}/mainsequence-wheel"
          uv venv "${wheel_env}" --python "${{ matrix.python-version }}"
          uv pip install --python "${wheel_env}/bin/python" dist/mainsequence-*.whl
          uv pip check --python "${wheel_env}/bin/python"
          "${wheel_env}/bin/python" -c "import mainsequence, mainsequence.client.models_foundry, mainsequence.client.metatables, mainsequence.cli.cli"
          "${wheel_env}/bin/python" -m mainsequence --help
