name: Deploy MkDocs Documentation

on:

  workflow_dispatch: # run manually from the Actions tab
    inputs:
      ref:
        description: "Branch or tag to build"
        required: false
        default: main
  # Called by publish-to-pypi.yml once a merge to `main` has been released. The
  # release tag is made by that workflow with the workflow token, and a tag
  # pushed that way starts no workflow, so a tag trigger here would never fire.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-docs:
    # extra safety so it only runs for `main` (a release) or a version tag
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'


      - name: Install MkDocs and plugins
        run: |
          pip install \
            mkdocs-material \
            mkdocs-gen-files \
            mkdocs-literate-nav \
            mkdocs-autorefs \
            mkdocs-mermaid2-plugin \
            'mkdocstrings[python]'

      - name: Build MkDocs site
        run: mkdocs build

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v5
