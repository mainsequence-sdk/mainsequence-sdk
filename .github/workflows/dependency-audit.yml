name: Dependency audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.scope }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: production
            export-arguments: --no-dev
          - scope: development
            export-arguments: --all-groups

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.17"

      - name: Install uv
        run: python -m pip install --upgrade 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70' && python -m pip install uv==0.13.4

      - name: Export locked ${{ matrix.scope }} dependencies
        run: >-
          uv export --frozen --no-hashes --no-emit-local
          ${{ matrix.export-arguments }}
          --output-file audit-requirements.txt

      - name: Audit ${{ matrix.scope }} dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: audit-requirements.txt
          no-deps: true
